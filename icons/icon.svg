<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Beacon Glow Filter -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Outer Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="110" ry="110" />
    </clipPath>
  </defs>

  <!-- Base Squircle with Clip -->
  <g clip-path="url(#squircleClip)">
    <!-- Dark Cybernetic Background -->
    <rect x="16" y="16" width="480" height="480" fill="url(#bgGrad)" />

    <!-- Ambient Glow from Center -->
    <circle cx="256" cy="256" r="180" fill="#0284c7" opacity="0.12" />

    <!-- Radar Sweep Arc -->
    <path d="M 256 256 L 256 76 A 180 180 0 0 1 436 256 Z" fill="url(#radarSweep)" />

    <!-- Globe / Radar Grid Lines -->
    <!-- Concentric Target Rings -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.35" stroke-dasharray="6 4" />
    <circle cx="256" cy="256" r="130" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.65" />
    <circle cx="256" cy="256" r="75" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <circle cx="256" cy="256" r="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />

    <!-- Globe Longitude Ellipses -->
    <ellipse cx="256" cy="256" rx="90" ry="180" fill="none" stroke="#0284c7" stroke-width="1.8" opacity="0.3" />
    <ellipse cx="256" cy="256" rx="45" ry="180" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.25" />

    <!-- Globe Latitude / Equator Lines -->
    <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="#0284c7" stroke-width="1.8" opacity="0.3" />

    <!-- Crosshair Telemetry Lines -->
    <line x1="256" y1="56" x2="256" y2="456" stroke="#06b6d4" stroke-width="2" opacity="0.45" />
    <line x1="56" y1="256" x2="456" y2="256" stroke="#06b6d4" stroke-width="2" opacity="0.45" />

    <!-- Target Calibration Ticks -->
    <line x1="256" y1="70" x2="256" y2="82" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="430" x2="256" y2="442" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="70" y1="256" x2="82" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="430" y1="256" x2="442" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Satellite / IP Nodes on Radar -->
    <circle cx="340" cy="180" r="5" fill="#38bdf8" filter="url(#cyanGlow)" />
    <circle cx="170" cy="310" r="4" fill="#06b6d4" filter="url(#cyanGlow)" />
    <circle cx="360" cy="330" r="4.5" fill="#10b981" filter="url(#cyanGlow)" />
    <circle cx="190" cy="160" r="3.5" fill="#38bdf8" opacity="0.8" />

    <!-- Connection vectors between nodes -->
    <path d="M 190 160 L 256 256 L 340 180" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3" />
    <path d="M 256 256 L 360 330" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3" />

    <!-- Central Telemetry Beacon (IP Pinpoint) -->
    <circle cx="256" cy="256" r="14" fill="#38bdf8" filter="url(#beaconGlow)" />
    <circle cx="256" cy="256" r="7" fill="#ffffff" />

    <!-- Inner Border Ring -->
    <rect x="18" y="18" width="476" height="476" rx="108" ry="108" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.3" />
  </g>

  <!-- Highlight Outer Rim Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.5" />
</svg>
